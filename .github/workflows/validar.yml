name: Validar entrega

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir pastas alteradas
        id: alvo
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          PASTAS=$(git diff --name-only "$BASE"...HEAD \
                    | grep -oE '^(exercicios/aula[0-9]{2}|projeto)' \
                    | sort -u | tr '\n' ' ')
          echo "pastas=$PASTAS" >> "$GITHUB_OUTPUT"
          [ -z "$PASTAS" ] && echo "vazio=true" >> "$GITHUB_OUTPUT" \
                           || echo "vazio=false" >> "$GITHUB_OUTPUT"
          echo "Pastas: ${PASTAS:-nenhuma}"

      - name: Verificar título do PR
        id: titulo
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITULO" | grep -qE '^\[(Aula [0-9]{2}|Auditoria M[1-7])\] .+'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar RESPOSTAS.md
        id: respostas
        if: steps.alvo.outputs.vazio == 'false'
        run: |
          FALTANDO=""
          for P in ${{ steps.alvo.outputs.pastas }}; do
            case "$P" in
              exercicios/aula*) [ -f "$P/RESPOSTAS.md" ] || FALTANDO="$FALTANDO $P" ;;
            esac
          done
          echo "faltando=$FALTANDO" >> "$GITHUB_OUTPUT"
          [ -z "$FALTANDO" ] && echo "ok=true" >> "$GITHUB_OUTPUT" \
                             || echo "ok=false" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
        if: steps.alvo.outputs.vazio == 'false'
        with:
          python-version: '3.13'

      - name: Instalar ferramentas
        if: steps.alvo.outputs.vazio == 'false'
        run: uv pip install --system pytest pytest-cov pytest-mock ruff mypy radon bandit

      - name: Lint (ruff)
        id: lint
        if: steps.alvo.outputs.vazio == 'false'
        continue-on-error: true
        run: ruff check ${{ steps.alvo.outputs.pastas }} 2>&1 | tee /tmp/ruff.txt

      - name: Testes (pytest)
        id: testes
        if: steps.alvo.outputs.vazio == 'false'
        continue-on-error: true
        run: |
          set -o pipefail
          pytest ${{ steps.alvo.outputs.pastas }} -v --tb=short 2>&1 | tee /tmp/pytest.txt

      - name: Comentar no PR
        if: always()
        uses: actions/github-script@v7
        env:
          VAZIO:     ${{ steps.alvo.outputs.vazio }}
          PASTAS:    ${{ steps.alvo.outputs.pastas }}
          TITULO_OK: ${{ steps.titulo.outputs.ok }}
          RESP_OK:   ${{ steps.respostas.outputs.ok }}
          RESP_FALT: ${{ steps.respostas.outputs.faltando }}
          LINT:      ${{ steps.lint.outcome }}
          TESTES:    ${{ steps.testes.outcome }}
        with:
          script: |
            const fs = require('fs');
            const e = process.env;
            const ler = (p) => { try { return fs.readFileSync(p,'utf8').slice(-5000); }
                                 catch { return '(nao executou)'; } };
            const L = ['## 🤖 Validação automática', ''];

            if (e.VAZIO === 'true') {
              L.push('⚠️ **Nenhuma pasta de exercício foi alterada neste PR.**', '',
                     'Verifique se você editou arquivos dentro de `exercicios/aulaNN/`.');
            } else {
              L.push(`**Pastas avaliadas:** \`${e.PASTAS.trim()}\``, '');
              L.push('| Verificação | Resultado |', '|---|---|');
              L.push(`| Título do PR | ${e.TITULO_OK === 'true' ? '✅ ok' : '⚠️ fora do padrão `[Aula NN] Seu Nome`'} |`);
              L.push(`| \`RESPOSTAS.md\` | ${e.RESP_OK === 'true' ? '✅ presente' : '❌ faltando em `' + (e.RESP_FALT||'').trim() + '`'} |`);
              L.push(`| \`ruff check\` | ${e.LINT === 'success' ? '✅ limpo' : '⚠️ achados (veja abaixo)'} |`);
              L.push(`| \`pytest\` | ${e.TESTES === 'success' ? '✅ passou' : '❌ falhou'} |`);
              L.push('');
              L.push('<details><summary>Saída do pytest</summary>', '', '```', ler('/tmp/pytest.txt'), '```', '', '</details>');
              L.push('<details><summary>Saída do ruff</summary>', '', '```', ler('/tmp/ruff.txt'), '```', '', '</details>');
              L.push('');
              L.push(e.TESTES === 'success'
                ? '> Verificação automática ok. A correção pela rubrica (corretude 35 / **rigor 30** / artefatos 25 / clareza 10) vem em seguida.'
                : '> Corrija e dê **push no mesmo branch** — a validação roda novamente.');
              L.push('');
              L.push('> 💡 Lembre: a **cobertura não é critério de aprovação** aqui. Ela mede execução, não verificação (Aula 01).');
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: L.join('\n'),
            });

      - name: Falhar se os testes quebraram
        if: steps.alvo.outputs.vazio == 'false' && steps.testes.outcome != 'success'
        run: exit 1
